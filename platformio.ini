; optional local overrides (see secrets.ini.example); ignored if absent
[platformio]
extra_configs = secrets.ini

; overridden by secrets.ini when present
[secrets]
build_flags =

[env:smalltv]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@^7
    tzapu/WiFiManager@2.0.17
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=-1
    -D TFT_DC=0
    -D TFT_RST=2
    -D TFT_SPI_MODE=SPI_MODE3
    -D SPI_FREQUENCY=40000000
    -D TFT_INVERSION_ON
    -D TFT_RGB_ORDER=TFT_BGR
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT7
    -D SMOOTH_FONT
    ${secrets.build_flags}

[env:native]
platform = native
build_src_filter = +<logic.cpp>
lib_deps = bblanchon/ArduinoJson@^7
test_build_src = yes
